name: Vérifier

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    # Le serveur tourne sur le PC Windows de la crèche ; Linux sert au développement.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      - run: npm run verifier
